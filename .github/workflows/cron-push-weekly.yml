name: Push - Empujón semanal (racha/reto)

on:
  schedule:
    # Jueves 23:00 UTC = 6pm hora Colombia: el aviso de "tu racha peligra"
    # llega justo antes de la noche de poker (jue/vie son las noches fuertes).
    - cron: '0 23 * * 4'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Solo simular (no envía)'
        required: false
        default: 'false'

jobs:
  push-weekly:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Invocar /player/push/run-weekly
        env:
          API_URL: ${{ secrets.RAKEFLOW_API_URL }}
          TOKEN: ${{ secrets.INTERNAL_CRON_TOKEN }}
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
        run: |
          if [ -z "$API_URL" ] || [ -z "$TOKEN" ]; then
            echo "::error::Missing RAKEFLOW_API_URL or INTERNAL_CRON_TOKEN secret"
            exit 1
          fi
          QS=""
          if [ "$DRY_RUN" = "true" ]; then QS="?dry_run=true"; fi
          set -e
          RESP=$(curl -fsS --max-time 300 -X POST \
            -H "X-Internal-Token: $TOKEN" \
            -H "Content-Type: application/json" \
            "$API_URL/player/push/run-weekly$QS")
          echo "$RESP" | python3 -m json.tool
          ERR=$(echo "$RESP" | python3 -c "import json,sys; print(json.load(sys.stdin).get('errors',0))")
          if [ "$ERR" != "0" ]; then
            echo "::warning::$ERR errores durante la corrida"
          fi
